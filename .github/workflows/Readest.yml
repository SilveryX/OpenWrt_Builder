name: Build Android APK (From Upstream)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游分支或版本 Tag (Upstream Branch/Tag)'
        required: true
        default: 'main'
        type: string
      server_url:
        description: '后端服务地址 (Server URL)'
        required: true
        default: 'https://book.zcee.cc'
        type: string
      supabase_anon_key:
        description: 'ANON_KEY (可选，留空则自动读取 Secret: NEXT_PUBLIC_SUPABASE_ANON_KEY)'
        required: false
        default: ''
        type: string
      target_arch:
        description: '选择构建架构 (Target Architecture)'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - universal
      create_release:
        description: '是否自动发布到 GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@main
        with:
          repository: 'readest/readest'
          ref: ${{ github.event.inputs.upstream_ref || 'main' }}
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@master

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: 24
          cache: pnpm

      - name: Extract App Version
        run: |
          VERSION=$(node -p "require('./apps/readest-app/package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ 提取到应用版本号: v$VERSION"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare Vendor Assets (PDF.js / simplecc)
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-cargo

      - name: Prepare Android Project & Keystore
        run: |
          cd apps/readest-app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png

          # 生成签名密钥库
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias readest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass readest123 \
            -keypass readest123 \
            -dname "CN=Readest, OU=Self, O=Readest, L=City, ST=State, C=CN"

          # 配置 Gradle 签名文件
          pushd src-tauri/gen/android
          cat << EOF > keystore.properties
          keyAlias=readest
          password=readest123
          storeFile=$RUNNER_TEMP/release.keystore
          EOF
          popd

      - name: Configure Environment Variables for Self-Hosted
        env:
          INPUT_ANON_KEY: ${{ github.event.inputs.supabase_anon_key }}
          SECRET_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          FINAL_ANON_KEY="${INPUT_ANON_KEY:-$SECRET_ANON_KEY}"
          if [ -z "$FINAL_ANON_KEY" ]; then
            echo "❌ 错误: 未获取到 ANON_KEY！请在 Actions 界面输入 supabase_anon_key 或在 GitHub Repository Secrets 中配置 NEXT_PUBLIC_SUPABASE_ANON_KEY。"
            exit 1
          fi

          echo "✅ 正在注入自建后端配置: $SERVER_URL"

          # 写入全局构建环境变量
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=$SERVER_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_API_BASE_URL=$SERVER_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$FINAL_ANON_KEY" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SELF_HOSTED=true" >> $GITHUB_ENV
          echo "SELF_HOSTED=true" >> $GITHUB_ENV

          cat << EOF > apps/readest-app/.env.local
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_SUPABASE_URL=$SERVER_URL
          NEXT_PUBLIC_API_BASE_URL=$SERVER_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$FINAL_ANON_KEY
          NEXT_PUBLIC_SELF_HOSTED=true
          SELF_HOSTED=true
          EOF

      - name: Build and Sign Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app/
          mkdir -p ../../output

          if [ "${{ github.event.inputs.target_arch }}" = "universal" ]; then
            pnpm tauri android build --apk
          else
            pnpm tauri android build -t aarch64 --apk
          fi

          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"

          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            echo "Signing and verifying $apk..."
            $BUILD_TOOLS_DIR/apksigner sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass pass:readest123 --ks-key-alias readest --key-pass pass:readest123 "$apk" || true
            $BUILD_TOOLS_DIR/apksigner verify --verbose "$apk" || true
            TARGET_NAME="Readest-v${APP_VERSION}-${{ github.event.inputs.target_arch }}.apk"
            cp "$apk" "../../output/$TARGET_NAME"
            echo "Saved APK as: output/$TARGET_NAME"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@main
        with:
          name: Readest-Android-APK
          path: output/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Readest v${{ env.APP_VERSION }} (Self-Hosted)
          draft: false
          prerelease: false
          files: output/*.apk
          body: |
            ## 📱 Readest v${{ env.APP_VERSION }} Android APK (自建服专用构建)

            - **上游版本**: `v${{ env.APP_VERSION }}` (${{ github.event.inputs.upstream_ref }})
            - **后端地址**: `${{ github.event.inputs.server_url }}`
            - **架构**: `${{ github.event.inputs.target_arch }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
